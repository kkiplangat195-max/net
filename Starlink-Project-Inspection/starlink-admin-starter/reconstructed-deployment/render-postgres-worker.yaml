databases:
  - name: starlink-primary
    databaseName: starlink
    user: starlink
    plan: basic-256mb

services:
  - type: web
    name: starlink-admin-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starlink-primary
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

  - type: worker
    name: starlink-notification-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starlink-primary
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NOTIFICATION_POLL_MS
        value: "5000"
      - key: NOTIFICATION_BATCH_SIZE
        value: "10"
